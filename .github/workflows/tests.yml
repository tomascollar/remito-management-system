# Pruebas automáticas: se ejecutan en cada push a dev/main y en cada pull request hacia main.
# Si algo falla, el commit aparece con una cruz roja en GitHub, ANTES de que llegue a producción.
name: Tests
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit # el código compila sin errores de tipos
      - run: npm test # Jest + Supertest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # compila tipos y genera el frontend de producción
